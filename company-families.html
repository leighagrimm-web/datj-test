try { const b = JSON.parse(sessionStorage.getItem('datj-pdf-back') || 'null'); if (b && b.p === location.pathname && Date.now() - b.t < 15 * 60000) { sessionStorage.removeItem('datj-pdf-back'); let n = 0; const go = () => { if (document.documentElement.scrollHeight >= b.y + 200 || n > 40) { window.scrollTo(0, b.y); return; } n++; setTimeout(go, 150); }; window.addEventListener('load', () => setTimeout(go, 300)); } } catch (e) {}
// Calendar subscribe (live feed): the studio calendar is studio.ics on this site (rebuilt on every publish);

wear\n- Comfortable clothes (no jeans or belts)\n- Hip Hop: clean gym shoes worn only inside. Ballet and Jazz/Contemporary: barefoot or socks", "tag": "", "photo": "", "label": "", "url": ""}], "summer": [{"t": "Summer Session", "d": "June 18 – July 31, 2027. Its own schedule, separate from the school year.", "more": "- Registration date coming soon\n- Classes and times are on the summer schedule\n- New Company dancers take the Summer Session", "tag": "June 18 – July 31", "photo": "Photo: summer class", "label": "Register", "url": "https://dancestudio-pro.com/online/index.php?account_id=20951"}, {"t": "Summer Intensives", "d": "Summer Intensives week: June 14–18, 2027.", "more": "- 2027 times and price coming soon\n- Returning Company Member Auditions are this week too\n- New Company dancers take the Summer Intensive", "tag": "June 14–18", "photo": "Photo: intensive", "label": "Register", "url": "https://dancestudio-pro.com/online/index.php?account_id=20951"}], "teams": [{"t": "Senior", "d": "Director: Katie Carey", "more": "", "tag": "", "photo": "images/wix/e1b06b_f22143bc1f3b4863a724aa5c88fb371c.jpg", "label": "", "url": "", "dancers": [{"t": "Bella M", "photo": "images/wix/e1b06b_f08dcc7364a645f58aad0f0a5706a6d6.jpg", "cap": false}, {"t": "Bella S", "photo": "images/wix/e1b06b_573c0c64213c4fcd96b0b7e0b6c95d45.jpg", "cap": false}, {"t": "Blaykleigh", "photo": "images/wix/e1b06b_ff153c87f6914d13856b73912491c437.jpg", "cap": false}, {"t": "Isabelle", "photo": "images/wix/e1b06b_c116b79e868e4ca99f16454bba4fea50.jpg", "cap": false}, {"t": "Jenna", "photo": "images/wix/e1b06b_bbb614fa412d4e37980cb00e71aeee0b.jpg", "cap": false}, {"t": "Juliana", "photo": "images/wix/e1b06b_dd48572a29354cd6a39c46be304a3892.jpg", "cap": false}, {"t": "Layla", "photo": "images/wix/e1b06b_4399cc5df1d140d88a23a4df15e580be.jpg", "cap": false}, {"t": "Lika", "photo": "images/wix/e1b06b_875bb415c9e84083bd1ccda5ea4314f8.jpg", "cap": false}, {"t": "Maria", "photo": "images/wix/e1b06b_fd7d503f2f "url": ""}, {"t": "Ballet, Pointe & Disney Dancing", "d": "Black leotard, studio tights, tight bun.", "more": "- Clothes: solid black leotard, studio brand tights; black shorts or ballet skirt optional (Disney Dancing: any color skirt or tutu). Boys: black fitted shirt or tank, black shorts\n- Shoes: Disney Dancing and Ballet I: studio brand ballet shoes, no laces. Ballet I/II and up: So Danca or Capezio canvas\n- Hair: tight ballet bun, bangs away from face (no messy buns)", "tag": "Dress code", "photo": "", "label": "", "url": ""}, {"t": "Combo", "d": "Black leotard, studio tights, ballet + jazz shoes.", "more": "- Clothes: solid black leotard, studio brand tights; black shorts optional. Boys: black shirt and shorts\n- Shoes: studio brand ballet shoes AND solid black jazz shoes, no laces\n- Hair: tight bun, bangs away from face", "tag": "Dress code", "photo": "", "label": "", "url": ""}, {"t": "Tap, Jazz Hip Hop & Hip Hop Basics", "d": "Black leotard with shorts or leggings.", "more": "- Clothes: solid black leotard, tight shorts or leggings. Boys: black shirt, shorts or leggings\n- Shoes: Tap: studio brand tap shoes (Tap 2 & 3: studio premium; Tap 4: Capezio Tan Manhattan Xtreme heel). Jazz Hip Hop: black jazz shoes. Hip Hop Basics: clean gym shoes worn only inside\n- Hair: bun or ponytail, bangs away from face", "tag": "Dress code", "photo": "", "label": "", "url": ""}, {"t": "Jazz Lyrical, Musical Theater & Contemporary", "d": "Black leotard, tan jazz or half sole shoes.", "more": "- Clothes: solid black leotard, black tight shorts or leggings. Boys: black shirt or tank, black shorts or leggings\n- Shoes: Jazz Lyrical and Musical Theater: studio brand tan jazz shoes. Contemporary: half sole shoes\n- Hair: tight bun, bangs away from face", "tag": "Dress code", "photo": "", "label": "", "url": ""}, {"t": "Modern, Acro & Leaps and Turns", "d": "Any color leotard; barefoot or jazz shoes.", "more": "- Clothes: any color leotard, tight shorts or leggings. Boys: any color shirt or tank, shorts or leggings\n- Shoes: Modern/Contemporary and Acro: barefoot. Leaps & Turns: studio brand black or tan jazz shoes\n- Hair: pulled back, bangs away from face", "tag": "Dress code", "photo": "", "label": "", "url": ""}, {"t": "Hip Hop & Breaking", "d": "Loose clothes and clean indoor gym shoes.", "more": "- Clothes: loose, comfortable clothes (no jeans or belts)\n- Shoes: clean gym shoes worn only inside; change at the studio. Breaking: a spin cap from The Breaking Program\n- Hair: no requirement", "tag": "Dress code", "photo": "", "label": "", "url": ""}, {"t": "Adults, Tiny Tots, Bollywood & Conditioning", "d": "Comfortable clothes; barefoot or socks.", "more": "- Clothes: comfortable clothes (no jeans or belts)\n- Shoes: Adult Hip Hop: clean gym shoes worn only inside. Everything else: barefoot or socks\n- Hair: no requirement", "tag": "Dress code", "photo": "", "label": "", "url": ""}, {"t": "Company rehearsals", "d": "Black leotard or crop top; turners or tan jazz shoes.", "more": "- Clothes: solid black leotard or black crop top, black tight shorts or leggings. No watches\n- Shoes: turners or tan jazz shoes\n- Hair: pulled back, bangs away from face", "tag": "Dress code", "photo": "", "label": "", "url": ""}], "compfam": [{"t": "Team calendar", "d": "Practices, rehearsals and extra classes.", "more": "Placeholder: how the team calendar works\n- Weekly practice times by team\n- Extra rehearsals before competitions\n- Where changes are posted", "tag": "", "photo": "", "label": "Open calendar", "url": "https://dancestudio-pro.com/online/index.php?account_id=20951"}, {"t": "Competition schedule", "d": "Dates, locations and call times.", "more": "- Competition 1: dates and city\n- Competition 2: dates and city\n- Competition 3: dates and city\nCall times are posted the week before.", "tag": "", "photo": "", "label": "", "url": ""}, {"t": "Fees & costumes", "d": "What’s due and when.", "more": "- Company fee: amount and due date\n- Competition entry fees\n- Costume fees and fittings", "tag": "", "photo": "", "label": "Pay in the Portal", "url": "https://dancestudio-pro.com/online/index.php?account_id=20951"}, {"t": "Team communication", "d": "Where updates are posted.", "more": "Placeholder: the app or group chat the teams use\n- How to join\n- Who to contact with questions", "tag": "", "photo": "", "label": "", "url": ""}, {"t": "Conventions", "d": "Optional workshops and dates.", "more": "Placeholder: which conventions the studio attends\n- Dates and location\n- Sign up by the deadline", "tag": "", "photo": "", "label": "", "url": "", "gform": "https://docs.google.com/forms/", "gformLabel": "Convention sign-up form"}, {"t": "Forms", "d": "Contracts and releases.", "more": "- Company contract\n- Photo release\n- Medical and emergency form", "tag": "", "photo": "", "label": "Open forms", "url": "https://dancestudio-pro.com/online/index.php?account_id=20951"}], "merch": [{"t": "Studio hoodie", "d": "Placeholder: price and sizes.", "more": "", "tag": "", "photo": "Photo: studio hoodie", "label": "Buy", "url": ""}, {"t": "Logo tee", "d": "Placeholder: price and sizes.", "more": "", "tag": "", "photo": "Photo: logo tee", "label": "Buy", "url": ""}, {"t": "Water bottle", "d": "Placeholder: price and sizes.", "more": "", "tag": "", "photo": "Photo: water bottle", "label": "Buy", "url": ""}, {"t": "Dance bag", "d": "Placeholder: price and sizes.", "more": "", "tag": "", "photo": "Photo: dance bag", "label": "Buy", "url": ""}], "tuitionBullets": [{"t": "$30 annual registration, per family", "d": "", "more": "", "tag": "", "photo": "", "label": "", "url": ""}, {"t": "10% off each class starting with the 3rd", "d": "", "more": "", "tag": "", "photo": "", "label": "", "url": ""}, {"t": "Make-ups within the same session (not in Session 4)", "d": "", "more": "", "tag": "", "photo": "", "label": "", "url": ""}], "familyLinks": [{"t": "Studio calendar", "d": "", "more": "", "tag": "", "photo": "", "label": "", "url": o May.", "auditions": "Company is an audition-based team for dancers ready to work hard and grow. Dancers must be 7 by September 1. Placement is based on attitude, technique, performance and readiness for the commitment.", "auditionsMore": "## When\n- New Member Auditions: Sunday, January 17, 2027 (sign up by January 15)\n- Returning Company Member Auditions: June 14–18, 2027, during Summer Intensives week\nMore than a competitive team: Company dancers represent the studio and grow as people.\n## Who can audition\n- 7 years old by September 1\n- New dancers also take the Summer Intensive Week and the Summer Dance Session\n## Classes you need first\n- Petite (Combo / Ballet I level), 2 classes: a full 55-minute Ballet or Combo, plus Jazz Lyrical, Jazz Hip Hop, Combo, Tap or Musical Theater\n- Intermediate, Junior, Teen & Senior (Ballet I/II and up), 3 classes: Ballet; Modern/Contemporary or Jazz Lyrical; plus Jazz Hip Hop, Hip Hop, Tap or Musical Theater\n## What we look for\n- Dedicated, prepared and hardworking\n- Positive leaders and supportive teammates\n- Open to challenge and feedback, proud to represent D&ATJ\n## What Company dancers gain\n- Confidence, strong technique and artistry\n- Time management and accountability\n- A team that feels like family\n- Performances plus 3–4 regional competitions, March to May", "address": "844 N Elmhurst Rd, Prospect Heights, IL 60070", "phone": "(847) 947-8464", "email": "team@danceandallthatjazz.com", "hours": "Placeholder: front desk hours.", "giftNote": "An eGift card, sent by email. Pick an amount or choose your own.", "giftUrl": "", "summerShow": "on", "merchNote": "Open seasonally. Order online, pick up at the front desk.", "perfNote": "All students perform in our 14th Annual Performance at Wheeling High School at the end of Session 4: May 22–23, with dress rehearsals May 19–21.", "schedulePdf": "DATJ_Class_Schedule.pdf", "facebook": "https://www.facebook.com/DanceandAllThatJazz", "instagram": "https://instagram.com/     const STAFF0 = [{"name": "Brittany Brady", "role": "Founder & owner", "tag": "Owner", "bio": "Brittany Brady (Cederberg) is the founder and CEO of Dance & All That Jazz Studio, which she established in 2013.\nBrittany’s passion for dance began at the young age of four, quickly growing into a lifelong love. She continued to dance throughout high school and later attended Illinois State University, where she was a member of the Redline Dance Team. Brittany pursued her passion by majoring in Business Entrepreneurship & Management with a minor in Dance Performance. Even as a little girl, Brittany had a clear vision for her future. Before heading off to college, she noticed a newly constructed strip mall in her hometown of Prospect Heights. She confidently told her parents that she would one day open her dance studio there.\nAfter graduating from college, Brittany continued to teach dance while working at a bank. Despite her success in banking, the dream of opening a dance studio never faded. In 2013, Brittany took the leap and fulfilled her dream, launching Dance & All That Jazz Studio with just eight classes a week. By 2016, Brittany’s vision had expanded, leading her to take over an additional space next to her studio. The studio expanded again in 2022, with the opening of a third studio space, now offering more than 70 classes a week.\nBrittany is grateful for the supportive community that has grown around Dance & All That Jazz. She is committed to maintaining a welcoming environment where dance, performance, and competition can thrive together. At Dance & All That Jazz, dancers not only learn to dance but also pick up valuable life skills and build meaningful friendships.", "photo": "images/wix/4c2aeb_6292969826d64288a90ad7b204fd53d2.jpg"},
      {"name": "Katie Carey", "role": "", "tag": "", "bio": "Katie Carey, has dedicated her life to the art of dance. With a passion that started at a young age in her hometown of Columbus, Ohio she moved to Chicago to train with Giordano Dance Chicago. Katie has performed as a main company dancer with Nomi Dance Company and Cocodaco Dance Project. Through her performances and choreography, she creates from the idea of letting a moment with someone on something take over until you give in completely with an abandonment to the feeling. Whether it be love, heartache, excitement, passion or grief, let it shake you to your core. She calls this concept “method dancing”. Katie is the co-founder of Purus Motus, a company that produces dance cinema, and is dedicated to merging concert dance and hip hop to create a unique viewpoint into how we watch different styles of dance. Purus Motus has been selected to present their work at film festivals around the world. Most recently they premiered at the San Francisco Film Festival. Katie has had the opportunity to create works on Nomi Dance Company, Trifecta Dance Collective, Cocodaco Dance Project, New Dances, Moonwater Dance Project, and is currently the resident choreographer for Hot Crowd, a contemporary/modern dance company in Chicago. In addition to her choreography career, Katie has been actively involved in teaching dance. She has conducted workshops and choreographed award winning dances all over the Midwest. Katie is immensely grateful for this life of constant creativity and is excited for the future!", "photo": "images/wix/4c2aeb_bf23bd1aa62d4ab79a75ab5b5d4e4c1d.jpg"},
      {"name": "Kelly Cunningham", "role": "", "tag": "", "bio": "Kelly began dancing at age 3 and has continued to feel a strong love and passion for dance ever since. She grew up in Cary, IL where she studied dance, voice, and acting her entire life. Her dance training includes jazz, tap, lyrical, ballet, hip hop, and musical theater styles. Kelly has trained with the Goodman Theater as well as getting her BFA in musical theater from Millikin University, and performing professional theater with William Street Rep. While at Millikin, Kelly was awarded with the Ron Smith Award for excellence in Musical Theater. Kelly believes in the power that art can have in our lives. How it teaches us not only about ourselves but the world around us, and how we can use art to encourage our differences and tell stories that spark conversation and change. She loves that being a teacher and choreographer allows her to instill that appreciation for dance as an art form to her students.", "photo": "images/wix/4c2aeb_05075630ca38458baa559f70feb13727.jpg"},
      {"name": "Meghan Hutto", "role": "", "tag": "", "bio": "Meghan Hutto is from Richmond, Virginia, where she began her dance training at Premiere Dance Studio. In high school, she completed a traineeship at the School of Richmond Ballet. In 2025, she graduated with honors from Butler University with a degree in Dance Performance and Computer Science. She has been a soloist in numerous choreography projects created by her peers and professors at Butler, as well as performing many full-length ballets. She has attended many workshops with Alvin Ailey, Hubbard Street, Steps on Broadway, and Visceral Dance Chicago. Additionally, she performed in Jamboree, a professional choreography workshop held by WhirlWind. Currently, she is a trainee with Visceral Dance Chicago. Her Inspiration comes from other artists’ passion and love for dance, and she is excited to be part of the Dance & All That Jazz community!", "photo": "images/wix/4c2aeb_da0d7be9a3fb4013a297ad347d844f55.jpg"},
      {"name": "Allison Pauley", "role": "", "tag": "", "bio": "Allison Pauley is a dance artist hailing from Buffalo Grove, IL. In May 2016, she graduated from the University of Illinois with a Bachelor of Fine Arts in Dance. At U of I, she had the pleasure of performing in works by faculty members Jan Erkert, Kristie Simson, Abby Zibikowski, and Sara Hook, as well as guest artists Jennifer Archibald and Earl Mosley. Her junior year, Pauley attended the Jerusalem Academy of Dance where she trained in Gaga with Batsheva Company.", "photo": "images/wix/4c2aeb_441d5dcbc3d8484482157d300e516087.jpg"},
      {"name": "Daniel Williams", "role": "", "tag": "", "bio": "With over a decade long of teaching experience in street art, Daniel has made a very unconventional style of learning hip hop very popular. Coming from the underground scene of hip hop, bboying, popping, and house, Daniel makes sure these styles are brought to the forefront of his choreography. Daniel has trained or worked under the influences of Brickheadz crew, Chicago Dance Crash, Shadow Puppets, and countless individuals to cultivate an array of bounce, groove, rock, roll and hit techniques to advance the complexity of the movement forward in the classroom.", "photo": "images/wix/4c2aeb_a9047ac5b2be44ff8269aa4340bf5879.jpg"},
      {"name": "Dillon Zamora", "role": "", "tag": "", "bio": "Dillon Zamora is a Chicago-based dance performer and choreographer. Dillon trained at his home studio in California in the Cecchetti Ballet method, contemporary, jazz, and hip hop. Dillon later studied at the University of California Irvine where he received two BFAs for Dance Choreography and Dance Performance. While at UCI Dillon performed in multiple shows and performed in works by Lar Lubovitch and Vitor Luiz DeSantos. Dillon was a trainee with Visceral Dance Chicago and worked with Braeden Barnes, Tina Diaz, Nick Pupillo, and Cait Cucchiarra. He’s also had the opportunity to work with renowned choreographers such as Ethan Colangelo, Nicole Von Arx, Alex Ketley, and Nicole Hennington. Currently, Dillon is a company dancer for both Winifred Haun and Dancers under the direction of Winifred Haun, and The Seldoms under the direction of Carrie Hanson.", "photo": "images/wix/4c2aeb_8839dbe2d2194cae96e638a1c6e3752c.jpg"},
      {"name": "Ben Goodman", "role": "", "tag": "The Breaking Program", "bio": "Ben started dancing at Dance & All That Jazz 10 years ago as a student, and now he’s back as an instructor. He’s spent the past 3 years in Indianapolis as an NBA dancer for the Indiana Pacers as well as a breakdance instructor. His favorite thing about teaching breakdance is that it’s a fun space to be creative and try new things.", "photo": "images/wix/4c2aeb_5b589b567eba4f8cb9add2368dee3979.jpg"},
      {"name": "Shetal Lettvin", "role": "", "tag": "", "bio": "Dancing has been a part of Shetal's life for as long as she can remember. She began performing at family events as a child and officially started dancing at the age of six. Growing up immersed in Bollywood music and culture, dance quickly became a natural form of expression for her. She was a member of the Poms team throughout middle and high school, and later in college, she joined and led a competitive Bollywood dance team that performed at events across the country. Outside of dance, she works in the sustainability industry and stay on her toes raising three energetic young kids!", "photo": "images/wix/4c2aeb_b177e9c03a894b2089b4313a05d30f6c.jpg"},
      {"name": "Akanksha Patel", "role": "", "tag": "", "bio": "With a lifelong love of dance, Akanksha brings a rich and versatile background to the studio. Classically trained in Kathak, she has also studied a wide range of Western styles including ballet, tap, jazz, hip hop, and contemporary. In high school, she was a member of her varsity poms team, and in college, she continued dancing as part of a Bollywood fusion team, blending traditional Indian dance with Western choreography. Akanksha continues to fuel her enthusiasm for movement by training with traveling choreographers in Indian-inspired styles. She’s excited to share her passion for Bollywood fusion and looks forward to bringing energy, creativity, and joy to every class!", "photo": "images/wix/4c2aeb_ef6223e8bb714e9fbbda156f6ef60f34.jpg"},
